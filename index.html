<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="hero">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input type="number" id="input-field-el" placeholder="Number">
            <button id="convert-btn">Convert</button>
        </div>
        <div id="values-sec">
            <div class="card" id="card-one">
            <h3>Length (Meter/Feet)</h3>
            <p id="meters-calc">1 meters = 3.281 feet | 1 feet = 0.304 meters</p>
            </div>
            <div class="card" id="card-two">
                <h3>Volume (Liters/Gallons)</h3>
                <p id="liters-calc">1 liters = 0.264 gallons | 1 gallons = 3.785 liters</p>
            </div>
            
            <div class="card" id="card-three">
                <h3>Mass (Kilograms/Pounds)</h3>
                <p id="kilos-calc">1 kilos = 2.204 pounds | 1 pounds = 0.453 kilos</p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
